# Self-Flow variant 2: source recipe port; GPU/checkpoint/closed-loop parity unverified.
model:
  _target_: patchwam.models.FluxAssetPolicy.from_local_assets
  transformer_path: ${oc.env:PATCHWAM_TRANSFORMER}
  autoencoder_path: ${oc.env:PATCHWAM_AUTOENCODER}
  text_encoder_path: ${oc.env:PATCHWAM_TEXT_ENCODER}
  flux_source: ${oc.env:FLUX2_SRC}
  action_dim: ${data.processor.action_output_dim}
  proprio_dim: ${data.processor.proprio_output_dim}
  variant: klein-base-4b
  dtype: bfloat16
  device: cuda
  context_length: 128
  shift: 5.0
  video_weight: 0.5
  action_weight: 1.0
  action_scale: 1.0
  gradient_checkpointing: true
  flow_normalization: endpoint_1000
  self_flow_variant: 2
  self_flow_mask_ratio: 0.25
  self_flow_representation_weight: 0.8
  self_flow_structure_ratio: 0.5
  self_flow_edge_ratio: 0.5
data:
  _target_: patchwam.data.EpisodeDataset
  dataset_dirs:
  - ${oc.env:PATCHWAM_DATA_ROOT}
  num_frames: 17
  endpoint_frames_only: true
  action_video_freq_ratio: 1
  global_sample_stride: 1
  sample_index_stride: 20
  video_size:
  - 288
  - 256
  concat_multi_camera: robotwin
  robotwin_camera_layout: compact_288x256
  val_set_proportion: 0.01
  is_training_set: true
  pretrained_norm_stats: ${oc.env:PATCHWAM_NORM_STATS}
  nonidle_filter_path: ${oc.env:PATCHWAM_NONIDLE_FILTER}
  shape_meta:
    images:
    - key: cam_high
      raw_shape:
      - 3
      - 480
      - 640
      shape:
      - 3
      - 240
      - 320
    - key: cam_left_wrist
      raw_shape:
      - 3
      - 480
      - 640
      shape:
      - 3
      - 240
      - 320
    - key: cam_right_wrist
      raw_shape:
      - 3
      - 480
      - 640
      shape:
      - 3
      - 240
      - 320
    action:
    - key: default
      raw_shape: 14
      shape: 14
    state:
    - key: default
      raw_shape: 14
      shape: 14
  processor:
    _target_: patchwam.data.SampleProcessor
    shape_meta: ${data.shape_meta}
    action_output_dim: 14
    proprio_output_dim: 14
    norm_default_mode: z-score
    use_stepwise_action_norm: false
  video_augmentation:
    _target_: patchwam.data.ClipAugment
    p: 0.5
    augment_types:
    - corrupt_only
    - color_only
    - both
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.03
    gamma:
      range:
      - 0.9
      - 1.1
    gaussian_noise:
      std: 0.01
    random_resized_crop:
      scale:
      - 0.95
      - 1.0
      ratio: preserve
    rotate:
      degrees: 5.0
      fill: mean
training:
  output_dir: runs/robotwin_self_flow_v2
  epochs: 10
  max_updates: null
  batch_size: 4
  accumulation: 2
  learning_rate: 0.0001
  weight_decay: 0.01
  precision: bf16
  workers: 16
  gradient_clip: 1.0
  checkpoint_every: 2500
  log_every: 10
  seed: 42
  betas:
  - 0.9
  - 0.95
  warmup_fraction: 0.05
  minimum_lr_fraction: 0.01
  global_batch_size: 64
  ema_decay: 0.9999
  ema_warmup_updates: 0
