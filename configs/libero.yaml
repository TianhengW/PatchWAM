# Development recipe; GPU parity unverified.
model:
  _target_: patchwam.models.FluxAssetPolicy.from_local_assets
  transformer_path: ${oc.env:PATCHWAM_TRANSFORMER}
  autoencoder_path: ${oc.env:PATCHWAM_AUTOENCODER}
  text_encoder_path: ${oc.env:PATCHWAM_TEXT_ENCODER}
  flux_source: ${oc.env:FLUX2_SRC}
  action_dim: ${data.processor.action_output_dim}
  proprio_dim: ${data.processor.proprio_output_dim}
  variant: klein-base-4b
  dtype: bfloat16
  device: cuda
  context_length: 128
  shift: 5.0
  video_weight: 0.5
  action_weight: 1.0
  action_scale: 1.0
  gradient_checkpointing: true
data:
  _target_: patchwam.data.EpisodeDataset
  dataset_dirs:
  - ${oc.env:PATCHWAM_DATA_ROOT}
  num_frames: 17
  endpoint_frames_only: true
  action_video_freq_ratio: 1
  global_sample_stride: 1
  sample_index_stride: 1
  video_size:
  - 224
  - 448
  concat_multi_camera: horizontal
  robotwin_camera_layout: compact_288x256
  val_set_proportion: 0.0
  is_training_set: true
  pretrained_norm_stats: ${oc.env:PATCHWAM_NORM_STATS}
  nonidle_filter_path: null
  shape_meta:
    images:
    - key: image
      raw_shape:
      - 3
      - 512
      - 512
      shape:
      - 3
      - 224
      - 224
    - key: wrist_image
      raw_shape:
      - 3
      - 512
      - 512
      shape:
      - 3
      - 224
      - 224
    action:
    - key: default
      raw_shape: 7
      shape: 7
    state:
    - key: default
      raw_shape: 8
      shape: 8
  processor:
    _target_: patchwam.data.SampleProcessor
    shape_meta: ${data.shape_meta}
    action_output_dim: 7
    proprio_output_dim: 8
    norm_default_mode: min/max
    use_stepwise_action_norm: false
    delta_action_dim_mask:
      default:
      - true
      - true
      - true
      - true
      - true
      - true
      - false
  video_augmentation:
    _target_: patchwam.data.ClipAugment
    p: 0.65
    augment_types:
    - corrupt_only
    - color_only
    - both
    - both
    color_jitter:
      brightness: 0.3
      contrast: 0.3
      saturation: 0.25
      hue: 0.04
    gamma:
      range:
      - 0.8
      - 1.25
    gaussian_noise:
      std: 0.015
    random_resized_crop:
      scale:
      - 0.92
      - 1.0
      ratio: preserve
    rotate:
      degrees: 8.0
      fill: mean
    exposure:
      ev_range:
      - -0.25
      - 0.25
training:
  output_dir: runs/libero
  epochs: 50
  max_updates: null
  batch_size: 8
  accumulation: 1
  learning_rate: 0.0001
  weight_decay: 0.01
  precision: bf16
  workers: 16
  gradient_clip: 1.0
  checkpoint_every: 2000
  log_every: 10
  seed: 42
  betas:
  - 0.9
  - 0.95
  warmup_fraction: 0.05
  minimum_lr_fraction: 0.01
