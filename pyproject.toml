[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patchwam"
version = "0.1.0.dev0"
description = "An Action Is Worth One Patch: Unified World-Action Modeling"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
authors = [{name = "PatchWAM contributors"}]
dependencies = [
  "torch==2.7.1", "torchvision==0.22.1", "numpy==1.26.4",
  "pillow==12.0.0", "pyyaml>=6.0", "hydra-core==1.3.2",
  "accelerate==1.12.0", "einops>=0.8,<0.9", "safetensors>=0.5,<1",
  "pandas==2.2.3", "pyarrow==23.0.0", "av==16.0.1",
]

[project.optional-dependencies]
flux = ["transformers==4.56.1", "huggingface-hub>=0.34,<1", "sentencepiece", "protobuf"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build"]

[project.scripts]
patchwam = "patchwam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["patchwam*"]

[tool.setuptools.package-data]
"patchwam.data" = ["PROVENANCE.json", "LICENSE*", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
